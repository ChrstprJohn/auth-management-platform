name: auth-dashboard-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dashboard_db
      POSTGRES_USER: dashboard_app
      POSTGRES_PASSWORD: local_dashboard_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dashboard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard_app -d dashboard_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dashboard_postgres_data:
