services:
  auth-dashboard-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-dashboard-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - app_network

  migrate:
    profiles:
      - maintenance
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - .env
    networks:
      - app_network

networks:
  app_network:
    external: true
