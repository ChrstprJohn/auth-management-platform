name: auth-platform-local

services:
  gotrue:
    image: supabase/gotrue:v2.196.0
    env_file:
      - .env
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "8081"
      GOTRUE_MAILER_TEMPLATES_INVITE: ${GOTRUE_MAILER_TEMPLATES_INVITE:-http://host.docker.internal:5173/email-templates/invitation.html}
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: ${GOTRUE_MAILER_TEMPLATES_CONFIRMATION:-http://host.docker.internal:5173/email-templates/confirmation.html}
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - existing_postgres

  mailpit:
    profiles: [mailpit]
    image: axllent/mailpit:v1.27.0
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - existing_postgres

networks:
  existing_postgres:
    external: true
    name: local-database-server_default

# PostgreSQL is intentionally not defined: use your existing local server.
